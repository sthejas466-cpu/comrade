<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMRADE – Smart Emergency Response Network</title>
  <meta name="description" content="COMRADE is a Smart Emergency Pole to Dashboard system for real-time public safety monitoring and emergency response." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <!-- Chart.js for dashboard analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-content">
        <div class="loading-emblem">
          <div class="emblem-ring emblem-ring-1"></div>
          <div class="emblem-ring emblem-ring-2"></div>
          <div class="emblem-ring emblem-ring-3"></div>
          <div class="emblem-core">
            <svg width="32" height="37" viewBox="0 0 24 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="lsga" x1="12" y1="0" x2="12" y2="28" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#f43f5e"/>
                  <stop offset="100%" stop-color="#7c1037"/>
                </linearGradient>
                <linearGradient id="lsgb" x1="12" y1="1" x2="12" y2="18" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
                  <stop offset="100%" stop-color="white" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <path d="M12 1L2 5.5V14C2 20.8 6.5 26.5 12 28C17.5 26.5 22 20.8 22 14V5.5L12 1Z" fill="url(#lsga)" stroke="rgba(255,100,120,0.5)" stroke-width="0.6" stroke-linejoin="round"/>
              <path d="M12 2.2L4 6.2V13.5C4 19.2 7.6 24.4 12 26.2C16.4 24.4 20 19.2 20 13.5V6.2L12 2.2Z" fill="url(#lsgb)"/>
              <rect x="10.75" y="8.5" width="2.5" height="11" rx="1.25" fill="white" opacity="0.95"/>
              <rect x="7" y="12.25" width="10" height="2.5" rx="1.25" fill="white" opacity="0.95"/>
            </svg>
          </div>
        </div>
        <div class="loading-wordmark">COMRADE</div>
        <p class="loading-tagline">Smart Emergency Response Network</p>
        <div class="loading-bar"><div class="loading-fill"></div></div>
        <div class="loading-status">Initializing secure connection…</div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
